
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Article | Inky</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">Inkly</a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="create-blog.html">Write</a>
      </div>
    </nav>
  </header>

  <main class="article-page">
    <a href="index.html" class="back-link">← Back to Home</a>

    <article id="articleContent">
  <p>Loading article...</p>
</article>

<section id="commentsSection" class="comments-section" hidden>
  <h2>Comments</h2>

  <form id="commentForm">
    <label for="commentName">Your name</label>
    <input
      id="commentName"
      type="text"
      maxlength="50"
      required
      placeholder="Enter your name"
    >

    <label for="commentText">Your comment</label>
    <textarea
      id="commentText"
      maxlength="1000"
      rows="4"
      required
      placeholder="Write your comment..."
    ></textarea>

    <button type="submit">Post comment</button>
    <p id="commentMessage" role="status"></p>
  </form>

  <div id="commentsList"></div>
</section>
  </main>

  <script src="article.js"></script>
  <script src="comments.js"></script>
</body>
</html>
